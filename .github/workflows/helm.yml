name: helm

on:
  push:
    branches: [main]
  pull_request:

jobs:
  helm:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - run: helm lint ./helm/sdlc-environment-gate
      - run: helm lint ./helm/sdlc-environment-gate -f ./helm/sdlc-environment-gate/values-example.yaml

      # render it with the defaults and with the poll mode, a broken template
      # fails here instead of on the cluster
      - run: helm template approval ./helm/sdlc-environment-gate > /dev/null
      - run: helm template approval ./helm/sdlc-environment-gate --set app.discoveryMode=poll --set github.organization=example > /dev/null
      - run: helm template approval ./helm/sdlc-environment-gate --set ingress.enabled=true > /dev/null
