apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.fullname }}
  labels:
    app: {{ .Values.fullname }}
type: Opaque
stringData:
  GITHUB_APP_ID: "{{ .Values.secrets.githubAppId }}"
  GITHUB_PRIVATE_KEY: "{{ .Values.secrets.githubPrivateKey }}"
  GITHUB_WEBHOOK_SECRET: "{{ .Values.secrets.githubWebhookSecret }}"
  JIRA_EMAIL: "{{ .Values.secrets.jiraEmail }}"
  JIRA_API_TOKEN: "{{ .Values.secrets.jiraApiToken }}"
  SERVICENOW_USERNAME: "{{ .Values.secrets.serviceNowUsername }}"
  SERVICENOW_PASSWORD: "{{ .Values.secrets.serviceNowPassword }}"
