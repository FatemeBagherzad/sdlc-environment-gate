apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.fullname }}
  labels:
    app: {{ .Values.fullname }}
type: Opaque
# Everything here is already base64, so it goes under data and not under
# stringData. See the comment in values.yaml for how to make the values.
data:
  GITHUB_APP_ID: {{ .Values.secrets.githubAppId | quote }}
  GITHUB_PRIVATE_KEY: {{ .Values.secrets.githubPrivateKey | quote }}
  GITHUB_WEBHOOK_SECRET: {{ .Values.secrets.githubWebhookSecret | quote }}
  JIRA_EMAIL: {{ .Values.secrets.jiraEmail | quote }}
  JIRA_API_TOKEN: {{ .Values.secrets.jiraApiToken | quote }}
  SERVICENOW_USERNAME: {{ .Values.secrets.serviceNowUsername | quote }}
  SERVICENOW_PASSWORD: {{ .Values.secrets.serviceNowPassword | quote }}
