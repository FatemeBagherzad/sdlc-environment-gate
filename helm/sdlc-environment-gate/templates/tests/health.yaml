apiVersion: v1
kind: Pod
metadata:
  name: {{ .Values.fullname }}-test
  labels:
    app: {{ .Values.fullname }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: health
      image: {{ .Values.tests.image }}
      command:
        - curl
        - --fail
        - --silent
        - --show-error
        - http://{{ .Values.fullname }}:{{ .Values.service.port }}/health
